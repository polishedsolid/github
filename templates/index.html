<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Image Downloader</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="container">
    <h1>Web Image Downloader</h1>
    <p class="subtitle">URLを入力すると、そのページの画像をまとめてZIPでダウンロードします。</p>

    <form id="download-form">
      <div class="input-group">
        <input
          type="text"
          id="url-input"
          name="url"
          placeholder="https://example.com"
          autocomplete="off"
          spellcheck="false"
          required
        >
        <button type="submit" id="submit-btn">ダウンロード</button>
      </div>
      <p class="hint">バナー・ファビコン・小さな装飾画像は自動的に除外されます。</p>
    </form>

    <div id="status-box" class="hidden">
      <div class="spinner"></div>
      <p id="status-text">処理中...</p>
    </div>

    <div id="success-box" class="hidden success-box">
      <p id="success-text"></p>
    </div>

    <div id="error-box" class="hidden error-box">
      <p id="error-text"></p>
    </div>
  </main>

  <script src="/static/js/main.js"></script>
</body>
</html>
